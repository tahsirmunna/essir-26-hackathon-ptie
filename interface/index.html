<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTIE — ESSIR 2026</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262a33;
    --text: #e8e9ec;
    --muted: #8b8f9a;
    --accent: #5b8cff;
    --accent-dim: #2a3a63;
    --user-bubble: #232838;
    --bot-bubble: #1b1e26;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
  }
  header .title {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  header .event {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  header .team {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  header .team span {
    color: var(--accent);
  }
  .settings {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
  }
  .settings input, .settings select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
  }
  .settings input[type="text"] {
    width: 190px;
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 70%;
    padding: 12px 14px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border: 1px solid var(--accent-dim);
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border: 1px solid var(--border);
  }
  .msg.error {
    align-self: flex-start;
    background: #2a1a1a;
    border: 1px solid var(--error);
    color: var(--error);
  }
  .msg .level-tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .empty {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  footer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 24px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14.5px;
    font-family: inherit;
    height: 44px;
    max-height: 140px;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  select#levelSelect {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 0 10px;
    height: 44px;
    font-size: 13px;
  }
  button#send {
    background: var(--accent);
    border: none;
    color: white;
    font-weight: 600;
    font-size: 14px;
    padding: 0 20px;
    height: 44px;
    border-radius: 10px;
    cursor: pointer;
  }
  button#send:disabled {
    background: var(--accent-dim);
    cursor: not-allowed;
  }
  .typing {
    align-self: flex-start;
    color: var(--muted);
    font-size: 13px;
    padding: 4px 4px;
  }
</style>
</head>
<body>

<header>
  <div class="title">
    <div class="event">ESSIR 2026 — The Fourth Turn</div>
    <div class="team">TEAM <span>PTIE</span></div>
  </div>
  <div class="settings">
    <label>API</label>
    <input id="apiUrl" type="text" value="https://memoriease.computing.dcu.ie/backend/query"> 
    <label>Level</label>
    <select id="levelSelect">
      <option value="1">1 — Retrieval</option>
      <option value="2">2 — Memory</option>
      <option value="3">3 — Reasoning</option>
    </select>
  </div>
</header>

<main id="chat">
  <div class="empty" id="emptyState">Ask a question about your document to get started.</div>
</main>

<footer>
  <textarea id="input" placeholder="Ask a question..." rows="1"></textarea>
  <button id="send">Send</button>
</footer>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const apiUrlInput = document.getElementById('apiUrl');
  const levelSelect = document.getElementById('levelSelect');
  const emptyState = document.getElementById('emptyState');

  function addMessage(text, cls, levelTag) {
    if (emptyState) emptyState.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    if (levelTag) {
      const tag = document.createElement('div');
      tag.className = 'level-tag';
      tag.textContent = levelTag;
      div.appendChild(tag);
    }
    const body = document.createElement('div');
    body.textContent = text;
    div.appendChild(body);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typingIndicator';
    div.textContent = 'Thinking...';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function sendQuestion() {
    const question = input.value.trim();
    if (!question) return;

    const url = apiUrlInput.value.trim();
    const level = parseInt(levelSelect.value, 10);

    addMessage(question, 'user');
    input.value = '';
    input.style.height = '44px';
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, level })
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        addMessage(data.detail || 'Request failed with status ' + res.status, 'error');
      } else {
        const answerText = data.answer || data.response || JSON.stringify(data, null, 2);
        addMessage(answerText, 'bot', 'Level ' + level);
      }
    } catch (err) {
      removeTyping();
      addMessage(
        'Could not reach the API. Check that docker compose is running, the URL above is correct, ' +
        'and that CORS is enabled on the server. (' + err.message + ')',
        'error'
      );
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', sendQuestion);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  });
  input.addEventListener('input', () => {
    input.style.height = '44px';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });
</script>

</body>
</html>
