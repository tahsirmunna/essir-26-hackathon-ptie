[project]
name = "fourth-turn"
version = "0.1.0"
description = "The Fourth Turn — a RAG-over-PDF backend scaffold (ESSIR 2026 hackathon)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "qdrant-client>=1.11",
    # PyMuPDF: structure-aware PDF extraction (font size + bold per text block), used to
    # detect headings and chunk by subsection. Handles two-column layouts, ligatures and
    # hyphenation far better than pypdf — see app/rag/ingest.py.
    "pymupdf>=1.24",
    # In-memory BM25 for the lexical half of hybrid search (dense + sparse), fused with
    # Qdrant's cosine search via Reciprocal Rank Fusion — see app/vectorstore/qdrant_store.py.
    "rank-bm25>=0.2",
    # Local embeddings out of the box (intfloat/multilingual-e5-large). Pulls torch,
    # so the first install is large. Swap the model, or switch embedding_backend to
    # "provider", if you'd rather not carry it — see app/rag/embeddings.py.
    "sentence-transformers>=3.0",
    # litellm gives you one interface to ~100 hosted providers (OpenAI, Anthropic,
    # Gemini, Groq, ...). Ollama and LM Studio are reached directly over HTTP and do
    # not need it — remove it if you only run local models.
    "litellm>=1.44",
    "python-multipart>=0.0.9",
]

# `uv sync` installs these too; `uv sync --no-dev` skips them (used in the Docker image).
[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
